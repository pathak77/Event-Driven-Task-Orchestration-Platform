

services:
  backend:
    image: buzop
    container_name: BuzOp
    environment:
      HTTP_PORT: "8080"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://backend-db:5432/task_store"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092" 
    ports:
      - "8080:8080"  
    depends_on:
      - backend-db

  backend-db:
    image: postgres:latest
    container_name: BuzOp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: task_store
    ports:
      - "5431:5432"

  auth:
    image: task_auth
    container_name: BuzAuth
    restart: unless-stopped

    environment:
      HTTP_PORT: "5000"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      SECURITY_JWT_EXPIRATION_TIME: "3600000"
      SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://auth-db:5432/db"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"

    ports:
      - "5500:5000"

    depends_on:
      auth-db:  
        condition: service_healthy
      kafka: 
        condition: service_started


  auth-db:
    image: postgres:16
    container_name: BuzAuth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d db"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  api_gateway:
    build: ./gateway-service
    container_name: Gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway-service/gateway/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./gateway-service/gateway/scripts:/usr/local/openresty/nginx/lua:ro
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
      - auth          
      - backend

  redis:
    image: redis:alpine  
    container_name: redis

volumes:
  auth-postgres-data: {}