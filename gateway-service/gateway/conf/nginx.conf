env JWT_SECRET;
pcre_jit on;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    include       mime.types;
    default_type  application/octet-stream;

    # Using the Docker container names for the internal networks
    upstream auth-service {
        server auth:5000; 
    }
    upstream backend-service {
        server backend:8080; 
    }
    upstream frontend-service {
        server host.docker.internal:5173;
    }

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    sendfile        on;
    keepalive_timeout  65;

    # OpenResty's default config includes a dummy server block that causes duplicate errors.

    # include /etc/nginx/conf.d/*.conf; 

    # Defined ONCE, globally inside the http block
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;;';

    server {
        # Nginx listens on 80 internally (Docker maps 8080 to this externally)
        listen 80;

         location / {
            proxy_pass http://frontend-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
    
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        location /auth/ {
        
            proxy_pass http://auth-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
            return 204;
            }
            access_by_lua_file /usr/local/openresty/nginx/lua/main.lua;
            proxy_pass http://backend-service;
        }

    }
}